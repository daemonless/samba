# dbuild configuration file
# Place in .daemonless/config.yaml or .dbuild.yaml (higher priority)
#
# Full reference: https://github.com/daemonless/dbuild

build:
  variants:
    - tag: 422-pkg
      containerfile: Containerfile.pkg
      pkg_name: samba422
      args:
        BASE_VERSION: "15.1"
        PKG_NAME: "samba422"
    - tag: 422-pkg-latest
      containerfile: Containerfile.pkg
      pkg_name: samba422
      args:
        BASE_VERSION: "15.1-latest"
        PKG_NAME: "samba422"
    - tag: 422-pkg-krb
      containerfile: Containerfile.krb
      pkg_name: samba422
      tag_desc: "**MIT Kerberos**. Built from ports with MIT KRB5 instead of Heimdal."
    - tag: 423-pkg
      containerfile: Containerfile.pkg
      pkg_name: samba423
      default: true
      args:
        BASE_VERSION: "15.1"
        PKG_NAME: "samba423"
      aliases: ["latest"]
    - tag: 423-pkg-latest
      containerfile: Containerfile.pkg
      pkg_name: samba423
      args:
        BASE_VERSION: "15.1-latest"
        PKG_NAME: "samba423"
    - tag: 423-pkg-krb
      containerfile: Containerfile.krb
      pkg_name: samba423
      args:
        SAMBA_VERSION: "423"
      tag_desc: "**MIT Kerberos**. Built from ports with MIT KRB5 instead of Heimdal."


cit:
  mode: port
  port: 445
  puid: false      # smbd runs as root (binds privileged 445/139); /config is root-owned by design

